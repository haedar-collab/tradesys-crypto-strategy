name: Binance Spot Live WebSocket Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-websocket-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public Binance Spot WebSocket quotes
        env:
          BINANCE_SMOKE_REPORT_PATH: ${{ runner.temp }}/binance-spot-live-smoke-report.json
        run: node scripts/binance-spot-live-smoke.js
      - name: Retain live-feed evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-spot-live-smoke-evidence
          path: ${{ runner.temp }}/binance-spot-live-smoke-report.json
          if-no-files-found: warn
          retention-days: 14
