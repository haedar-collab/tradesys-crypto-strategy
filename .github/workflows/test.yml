name: Strategy Engine Tests

on:
  push:
    branches:
      - main
      - "foundation/**"
      - "feature/app-data-contract-v1"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test suite
        run: npm test
