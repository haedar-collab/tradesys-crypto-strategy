name: Live Binance Strategy Event Backtest
on:
  push:
    branches: [feature/app-data-contract-v1]
    paths:
      - 'scripts/live-binance-event-backtest.mjs'
      - 'src/integration/**'
      - 'src/backtest/**'
      - '.github/workflows/live-binance-event-backtest.yml'
  workflow_dispatch:
    inputs:
      symbol:
        description: Binance Spot symbol
        required: true
        default: BTCUSDT
permissions:
  contents: read
jobs:
  event-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/app-data-contract-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Binance candles and run MTF-to-event backtest
        env:
          SYMBOL: ${{ inputs.symbol }}
          OUTPUT_FILE: artifacts/binance-btcusdt-event-backtest.json
        run: node scripts/live-binance-event-backtest.mjs
      - name: Upload event backtest report
        uses: actions/upload-artifact@v4
        with:
          name: binance-live-event-backtest
          path: artifacts/binance-btcusdt-event-backtest.json
          if-no-files-found: error
          retention-days: 7
